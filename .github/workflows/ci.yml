name: Pruebas y paquete .deb

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:          # lo reutiliza lanzamiento.yml: nunca se publica nada sin pasar las pruebas

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets python3-pyside6.qtdbus \
            python3-gi python3-dbus gir1.2-gstreamer-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            ffmpeg dbus fonts-dejavu-core libegl1 libgl1 libxkbcommon0

      - name: Pruebas (sesión de bus limpia, sin pantalla)
        run: |
          dbus-run-session -- env QT_QPA_PLATFORM=offscreen OWEECAPTURE_SIN_ATAJOS=1 PYTHONPATH=src \
            python3 -W ignore -m unittest discover -s tests -v

      - name: Construir el paquete .deb
        run: ./packaging/crear_deb.sh 0.0.0-ci

      - name: Comprobar el contenido del paquete
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb | grep -E "usr/bin/oweecapture|oweecapture.desktop|qtapp.py"

      - uses: actions/upload-artifact@v4
        with:
          name: oweecapture-deb
          path: dist/*.deb
          if-no-files-found: error
