name: Sitio web

# Republica la página del proyecto (web/) y el repositorio apt SIN crear una versión nueva: toma el .deb de la última release.
# Se ejecuta al cambiar web/ en main o a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths: ['web/**', 'packaging/crear_repo_apt.sh', '.github/workflows/sitio.yml']
  workflow_dispatch:

permissions:
  contents: write          # subir la rama gh-pages, que sirve GitHub Pages

concurrency:
  group: sitio-gh-pages    # la misma cola que usa el lanzamiento: nunca dos subidas a la vez
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar el sitio
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el .deb de la última release
        run: |
          mkdir deb && gh release download --pattern '*.deb' --dir deb
          ls -l deb

      - name: Firmar y construir el sitio
        run: |
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "falta el secreto APT_GPG_PRIVATE_KEY"; exit 1; }
          sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          ./packaging/crear_repo_apt.sh deb/*.deb sitio
          cmp sitio/oweecapture.gpg packaging/oweecapture-archive-keyring.gpg

      - name: Publicar en GitHub Pages (rama gh-pages)
        run: |
          cd sitio
          git init -q -b gh-pages && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Sitio de OweeCapture"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
