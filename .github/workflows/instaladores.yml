name: Instaladores en cada distribución

# Instala OweeCapture de verdad, en contenedores limpios de cada distribución, y comprueba que arranca (`oweecapture --comprobar`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:          # lo reutiliza lanzamiento.yml: no se publica una versión cuyo instalador no funcione

permissions:
  contents: read

jobs:
  construir-deb:
    name: Construir el .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./packaging/crear_deb.sh 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: deb-instalador
          path: dist/*.deb
          if-no-files-found: error

  probar-deb:
    name: .deb en ${{ matrix.imagen }}
    needs: construir-deb
    runs-on: ubuntu-24.04
    container: ${{ matrix.imagen }}
    strategy:
      fail-fast: false
      matrix:
        imagen: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:25.10"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-instalador
          path: deb
      - name: Instalar el .deb (apt resuelve las dependencias)
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates
          apt-get install -y --no-install-recommends ./deb/*.deb          # sin «recomendados»: demuestra que las dependencias obligatorias bastan
      - name: Comprobar que arranca
        run: |
          if [ -x /opt/oweecapture/venv/bin/python ]; then echo ">> PySide6 de PyPI (entorno propio)"; else echo ">> PySide6 de la distribución"; fi
          oweecapture --version
          oweecapture --comprobar
      - name: El entorno propio ve los paquetes del sistema (gi, dbus, oweecapture) aunque su Python no los incluya
        run: |
          if [ -x /opt/oweecapture/venv/bin/python ]; then
            /usr/bin/python3 -m venv /tmp/entorno-aislado     # un Python que NO ve /usr/lib/python3/dist-packages, como el de algunos Deepin
            SP=$(/tmp/entorno-aislado/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
            ! /tmp/entorno-aislado/bin/python -c "import oweecapture" 2>/dev/null           # sin el .pth no lo ve (reproduce el fallo)
            echo /usr/lib/python3/dist-packages > "$SP/oweecapture-sistema.pth"            # el mismo mecanismo que escribe la instalación
            PYTHONPATH=/usr/lib/oweecapture /tmp/entorno-aislado/bin/python -c "import oweecapture, gi, dbus; print('con el .pth y PYTHONPATH ve oweecapture, gi y dbus')"
            echo "contenido del .pth que escribió la instalación:"; cat /opt/oweecapture/venv/lib/python3*/site-packages/oweecapture-sistema.pth
          else echo "esta distribución usa el PySide6 del sistema: no hay entorno propio que comprobar"; fi
      - name: Comprobar que Qt abre una ventana en una sesión X11 (pantalla virtual)
        run: |
          apt-get install -y -qq --no-install-recommends xvfb xauth
          xvfb-run -a env QT_QPA_PLATFORM=xcb oweecapture --comprobar
      - name: Desinstalar y comprobar que no queda nada
        run: |
          apt-get remove -y oweecapture
          test ! -e /opt/oweecapture
          ! command -v oweecapture

  actualizar-deb:
    name: Actualizar encima de un entorno propio roto (${{ matrix.imagen }})
    needs: construir-deb
    runs-on: ubuntu-24.04
    container: ${{ matrix.imagen }}
    strategy:
      fail-fast: false
      matrix:
        imagen: ["debian:13", "ubuntu:25.10"]          # las que traen PySide6 en apt
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-instalador
          path: deb
      - name: Sistema con PySide6 propio y un entorno viejo roto de una instalación anterior
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets
          mkdir -p /opt/oweecapture/venv/bin
          printf '#!/bin/sh\nexit 1\n' > /opt/oweecapture/venv/bin/python; chmod +x /opt/oweecapture/venv/bin/python
      - name: Instalar el .deb encima
        run: apt-get install -y --no-install-recommends ./deb/*.deb
      - name: Debe usar el PySide6 del sistema y haber retirado el entorno viejo
        run: |
          test ! -e /opt/oweecapture
          oweecapture --version
          oweecapture --comprobar

  actualizar-desde-publicada:
    name: Actualizar encima de la 0.1.4 publicada (${{ matrix.imagen }})
    needs: construir-deb
    runs-on: ubuntu-24.04
    container: ${{ matrix.imagen }}
    strategy:
      fail-fast: false
      matrix:
        imagen: ["debian:12", "ubuntu:25.10"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-instalador
          path: deb
      - name: Instalar la 0.1.4 publicada (instalación limpia)
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl
          curl -fsSL -o /tmp/publicada.deb https://github.com/oweeme/oweecapture/releases/download/v0.1.4/oweecapture_0.1.4_all.deb
          apt-get install -y --no-install-recommends /tmp/publicada.deb
          oweecapture --version
      - name: Actualizar encima con el .deb nuevo (dpkg ejecuta el postrm de la versión vieja)
        run: dpkg -i ./deb/*.deb
      - name: Después de actualizar debe seguir funcionando
        run: |
          # desde un proceso sin terminal el lanzador guarda los errores en el registro de arranque: se imprime si falla
          fallo() { echo "--- registro de arranque:"; cat "$HOME/.cache/oweecapture/arranque.log" 2>/dev/null; ls -la /usr/lib/oweecapture /usr/lib/python3/dist-packages/oweecapture 2>&1 | head; exit 1; }
          oweecapture --version || fallo
          oweecapture --comprobar || fallo
          test -d /usr/lib/oweecapture/oweecapture

  probar-script:
    name: install.sh en ${{ matrix.imagen }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.imagen }}
    strategy:
      fail-fast: false
      matrix:
        imagen: ["ubuntu:24.04", "fedora:latest", "archlinux:latest", "opensuse/tumbleweed:latest"]
    steps:
      - name: Herramientas básicas para descargar el código
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tar gzip git ca-certificates
          elif command -v dnf >/dev/null; then dnf install -y tar gzip git ca-certificates
          elif command -v pacman >/dev/null; then pacman -Syu --noconfirm tar gzip git ca-certificates
          elif command -v zypper >/dev/null; then zypper --non-interactive install tar gzip git ca-certificates; fi
      - uses: actions/checkout@v4
      - name: Instalar con install.sh (dependencias del sistema incluidas)
        run: ./install.sh --dependencias --si
      - name: Comprobar que Qt abre una ventana en una sesión X11 (pantalla virtual)
        run: |
          if command -v apt-get >/dev/null; then apt-get install -y -qq --no-install-recommends xvfb xauth
          elif command -v dnf >/dev/null; then dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth
          elif command -v pacman >/dev/null; then pacman -S --noconfirm xorg-server-xvfb xorg-xauth
          elif command -v zypper >/dev/null; then zypper --non-interactive install xorg-x11-server-Xvfb xvfb-run xauth; fi
          xvfb-run -a env QT_QPA_PLATFORM=xcb "$HOME/.local/bin/oweecapture" --comprobar
      - name: Desinstalar y comprobar que no queda nada
        run: |
          ./install.sh --desinstalar
          test ! -e "$HOME/.local/bin/oweecapture"
          test ! -e "$HOME/.local/share/oweecapture"
