name: Lanzamiento

# Se ejecuta al crear una etiqueta de versión (git tag v0.2.0 && git push --tags): pasa las pruebas, construye el .deb
# y el código fuente, y publica todo en una «release» de GitHub con sumas de verificación.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml

  instaladores:
    uses: ./.github/workflows/instaladores.yml

  publicar:
    name: Publicar la versión
    needs: [pruebas, instaladores]
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # crear la release y subir los archivos
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión (sin la «v» de la etiqueta)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Construir el .deb y el código fuente
        run: |
          ./packaging/crear_deb.sh "$VERSION"
          git archive --format=tar.gz --prefix="oweecapture-$VERSION/" -o "dist/oweecapture-$VERSION-fuente.tar.gz" HEAD          # incluye install.sh, el instalador universal
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Notas de la release
        run: |
          cat > notas.md <<EOF
          ## Instalar en cualquier distribución de Linux

          **Debian, Ubuntu, Deepin, Mint y derivadas:** \`sudo apt install ./oweecapture_${VERSION}_all.deb\`. Si tu distribución no trae PySide6 (Debian 12, Ubuntu 24.04, Deepin 23), la instalación lo descarga de PyPI (unos 100 MB) a \`/opt/oweecapture/venv\`; hace falta red.

          **Fedora, Arch, openSUSE y cualquier otra:** descomprime \`oweecapture-${VERSION}-fuente.tar.gz\` y ejecuta \`./install.sh --dependencias\` (instala en \`~/.local\`; pide confirmación antes de usar \`sudo\`). Fedora necesita RPM Fusion para los codificadores H.264 y AAC.

          Comprueba la instalación con \`oweecapture --comprobar\`. Los instaladores se prueban en cada versión en Debian 12 y 13, Ubuntu 24.04 y 25.10, Fedora, Arch y openSUSE Tumbleweed.

          **Límites:** solo Linux con Wayland y portal de pantalla; probado de verdad en KDE Plasma. GNOME y Deepin están sin probar en un escritorio real. Windows todavía no está soportado.
          EOF
      - name: Crear la release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "OweeCapture $VERSION" \
            --generate-notes \
            --notes-file notas.md

  repositorio-apt:
    name: Publicar el repositorio apt
    needs: [publicar]
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # subir la rama gh-pages, que sirve GitHub Pages
    env:
      GH_TOKEN: ${{ github.token }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el .deb de la release
        run: |
          mkdir deb && gh release download "$GITHUB_REF_NAME" --pattern '*.deb' --dir deb
          ls -l deb

      - name: Firmar y construir el repositorio
        run: |
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "falta el secreto APT_GPG_PRIVATE_KEY"; exit 1; }
          sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          ./packaging/crear_repo_apt.sh deb/*.deb sitio
          # la clave pública publicada debe ser la que lleva el .deb: si no, nadie podría verificar las actualizaciones
          cmp sitio/oweecapture.gpg packaging/oweecapture-archive-keyring.gpg

      - name: Publicar en GitHub Pages (rama gh-pages)
        run: |
          cd sitio
          git init -q -b gh-pages && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Repositorio apt de OweeCapture ${GITHUB_REF_NAME}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
